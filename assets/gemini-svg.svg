<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Style Definitionen für das authentische SAP EWM / Leitstand Look & Feel -->
  <style>
    .bg { fill: #042b55; }
    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .panel-bg { fill: #071e3d; stroke: #1e3a8a; stroke-width: 2; }
    .header-bar { fill: #0f172a; }
    .text-title { fill: #D97706; font-family: monospace; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
    .text-mono { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .text-bright { fill: #f8fafc; font-family: monospace; font-size: 12px; }
    .text-accent { fill: #38bdf8; font-family: monospace; font-size: 12px; }
    .table-header { fill: #1e293b; }
    .cell-border { stroke: #1e3a8a; stroke-width: 1; fill: none; }
    .accent-bar { fill: #D97706; }
    .status-dot { fill: #22c55e; }
    .status-alert { fill: #D97706; animate: pulse 2s infinite; }
    .button-bg { fill: #1e3a8a; stroke: #38bdf8; stroke-width: 1; }
    .button-text { fill: #f8fafc; font-family: monospace; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- Globaler Hintergrund (Stahlblau) -->
  <rect width="1200" height="800" class="bg"/>

  <!-- Technisches CAD / WMS Koordinaten-Gitter -->
  <g>
    <!-- Vertikale Linien -->
    <line x1="100" y1="0" x2="100" y2="800" class="grid-line"/><line x1="200" y1="0" x2="200" y2="800" class="grid-line"/><line x1="300" y1="0" x2="300" y2="800" class="grid-line"/><line x1="400" y1="0" x2="400" y2="800" class="grid-line"/><line x1="500" y1="0" x2="500" y2="800" class="grid-line"/><line x1="600" y1="0" x2="600" y2="800" class="grid-line"/><line x1="700" y1="0" x2="700" y2="800" class="grid-line"/><line x1="800" y1="0" x2="800" y2="800" class="grid-line"/><line x1="900" y1="0" x2="900" y2="800" class="grid-line"/><line x1="1000" y1="0" x2="1000" y2="800" class="grid-line"/><line x1="1100" y1="0" x2="1100" y2="800" class="grid-line"/>
    <!-- Horizontale Linien -->
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line"/><line x1="0" y1="200" x2="1200" y2="200" class="grid-line"/><line x1="0" y1="300" x2="1200" y2="300" class="grid-line"/><line x1="0" y1="400" x2="1200" y2="400" class="grid-line"/><line x1="0" y1="500" x2="1200" y2="500" class="grid-line"/><line x1="0" y1="600" x2="1200" y2="600" class="grid-line"/><line x1="0" y1="700" x2="1200" y2="700" class="grid-line"/>
  </g>

  <!-- Hauptfenster-Rahmen (SAP EWM Masken-Layout) -->
  <g transform="translate(50, 50)">
    <rect width="1100" height="700" rx="4" class="panel-bg"/>
    
    <!-- Oberste Systemleiste -->
    <rect width="1100" height="40" rx="4" class="header-bar"/>
    <rect x="0" y="38" width="1100" height="2" class="accent-bar"/>
    <text x="20" y="25" class="text-title">SAP EWM // WARENEINGANG (WE) — DIALOG MASK</text>
    <circle cx="1040" cy="20" r="6" class="status-dot"/>
    <text x="1055" y="24" class="text-mono">HOST: S4HANA_01</text>

    <!-- Funktionsleiste / Menü -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="100" height="28" rx="2" class="button-bg"/><text x="50" y="14" class="button-text">F2 BUCHEN</text>
      <rect x="110" y="0" width="100" height="28" rx="2" class="button-bg"/><text x="160" y="14" class="button-text">F4 DETAIL</text>
      <rect x="220" y="0" width="100" height="28" rx="2" class="button-bg"/><text x="270" y="14" class="button-text">F6 PRÜFEN</text>
      <rect x="330" y="0" width="100" height="28" rx="2" class="button-bg"/><text x="380" y="14" class="button-text">F8 STORNO</text>
    </g>

    <!-- Such- und Filterbereich -->
    <g transform="translate(20, 110)">
      <rect width="1060" height="60" fill="#041a30" stroke="#1e3a8a"/>
      <text x="20" y="35" class="text-mono">ANLIEFERUNG: [ 8400291345 ]</text>
      <text x="320" y="35" class="text-mono">LADEEINHEIT: [ LE_HIGHBAY_09 ]</text>
      <text x="680" y="35" class="text-bright">LAGERORT: 0010 (Hochregal)</text>
    </g>

    <!-- Datentabelle (Positionen) -->
    <g transform="translate(20, 190)">
      <!-- Tabellenkopf -->
      <rect width="1060" height="30" class="table-header"/>
      <text x="20" y="20" class="text-bright">POS</text>
      <text x="80" y="20" class="text-bright">ARTIKELNUMMER</text>
      <text x="280" y="20" class="text-bright">BEZEICHNUNG</text>
      <text x="600" y="20" class="text-bright">MENGE SOLL</text>
      <text x="750" y="20" class="text-bright">MENGE IST</text>
      <text x="900" y="20" class="text-bright">ZIELBIN</text>

      <!-- Zeile 1 -->
      <g transform="translate(0, 35)">
        <rect width="1060" height="35" fill="none" class="cell-border"/>
        <text x="20" y="22" class="text-mono">0010</text>
        <text x="80" y="22" class="text-accent">ART-99482-X</text>
        <text x="280" y="22" class="text-bright">Industrie-Lenkrolle HD 200mm</text>
        <text x="600" y="22" class="text-mono">500 ST</text>
        <text x="750" y="22" class="text-bright">500 ST</text>
        <text x="900" y="22" class="text-accent">HGR-04-12-A</text>
      </g>

      <!-- Zeile 2 -->
      <g transform="translate(0, 70)">
        <rect width="1060" height="35" fill="rgba(255,255,255,0.02)" class="cell-border"/>
        <text x="20" y="22" class="text-mono">0020</text>
        <text x="80" y="22" class="text-accent">ART-11034-B</text>
        <text x="280" y="22" class="text-bright">Stahlprofil 40x40 anodisiert</text>
        <text x="600" y="22" class="text-mono">120 m</text>
        <text x="750" y="22" class="text-bright">120 m</text>
        <text x="900" y="22" class="text-accent">HGR-04-14-C</text>
      </g>

      <!-- Zeile 3 -->
      <g transform="translate(0, 105)">
        <rect width="1060" height="35" fill="none" class="cell-border"/>
        <text x="20" y="22" class="text-mono">0030</text>
        <text x="80" y="22" class="text-accent">ART-55201-K</text>
        <text x="280" y="22" class="text-bright">Sensor-Modul Proximity 24V</text>
        <text x="600" y="22" class="text-mono">45 ST</text>
        <text x="750" y="22" class="text-bright">45 ST</text>
        <text x="900" y="22" class="text-accent">HGR-01-02-F</text>
      </g>

      <!-- Zeile 4 -->
      <g transform="translate(0, 140)">
        <rect width="1060" height="35" fill="rgba(255,255,255,0.02)" class="cell-border"/>
        <text x="20" y="22" class="text-mono">0040</text>
        <text x="80" y="22" class="text-accent">ART-88390-Z</text>
        <text x="280" y="22" class="text-bright">Sicherheits-Lichtschranke Set</text>
        <text x="600" y="22" class="text-mono">10 ST</text>
        <text x="750" y="22" class="text-bright">10 ST</text>
        <text x="900" y="22" class="text-accent">HGR-02-08-B</text>
      </g>
    </g>

    <!-- Untere Status- und Protokollkonsole -->
    <g transform="translate(20, 530)">
      <rect width="1060" height="120" fill="#020d1a" stroke="#1e3a8a"/>
      <text x="15" y="25" class="text-title" style="font-size: 11px;">SYSTEM LOG / CONSOLE OUTPUT:</text>
      <text x="15" y="48" class="text-mono">> [17:42:01] ASN 8400291345 successfully imported from ERP gateway.</text>
      <text x="15" y="68" class="text-mono">> [17:42:15] Radio frequency scanner RF-04 assigned to user WMS_OPERATOR_2.</text>
      <text x="15" y="88" class="text-accent">> [17:42:30] Material WE positions verified. Ready for stock placement confirmation.</text>
      <text x="15" y="108" class="text-bright">> [OK] Database sync established with LFS conveyor controller.</text>
    </g>
  </g>
</svg>
