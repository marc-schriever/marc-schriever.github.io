<!doctype html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marc Schriever · Lagerleiter</title>
    <meta name="description" content="Marc Schriever – Lagerleiter mit Fokus auf Effizienz, Digitalisierung und Führung." />
    <meta property="og:title" content="Marc Schriever · Lagerleiter" />
    <meta property="og:description" content="Marc Schriever – Lagerleiter mit Fokus auf Effizienz, Digitalisierung und Führung." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Schriftarten -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="vendor/tabler-icons.min.css" />

    <!-- OOCSS Stylesheet -->
<!-- Pfad zur CSS-Datei im css/-Ordner -->
<!-- In index.html im <head>-Bereich -->
<link rel="stylesheet" href="style.css" />

    <!-- Supabase SDK & QR Scanner Bibliothek -->
    <script src="vendor/supabase.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
  </head>
  <body>
    <div class="site-background"></div>
    <div class="c-page-deco" id="page-deco" aria-hidden="true"></div>

    <div class="site-wrapper">
      <!-- NAVIGATION -->
      <nav class="c-navbar">
        <div class="o-container c-navbar__inner">
          <a href="#home" class="c-navbar__brand">
            <span class="c-navbar__brand-name navbar__name">MARC SCHRIEVER</span>
            <span class="c-navbar__brand-title navbar__title">LAGERLEITER</span>
          </a>

          <!-- Desktop Navigation -->
          <ul class="c-navbar__menu navbar__links"></ul>

          <!-- Mobile Hamburger Toggle -->
          <button class="c-navbar__toggle navbar__hamburger" aria-label="Menü öffnen" aria-expanded="false">
            <span class="c-navbar__toggle-line"></span>
            <span class="c-navbar__toggle-line"></span>
            <span class="c-navbar__toggle-line"></span>
          </button>
        </div>
      </nav>

      <!-- Mobile Nav Drawer -->
      <ul id="navbar-dropdown" class="c-mobile-nav navbar__dropdown-links" aria-hidden="true"></ul>

      <main>
        <!-- HERO SECTION -->
        <section id="home" class="o-section o-section--hero">
          <div class="o-container">
            <div class="c-hero">
              <div class="c-hero__image-bg"></div>
              <div class="c-hero__overlay"></div>
              <div class="c-hero__inner">
                <div class="c-hero__content">
                  <span id="hero-eyebrow" class="c-hero__badge"></span>
                  <h1 id="hero-title" class="c-hero__headline"></h1>
                  <p id="hero-sub" class="c-hero__subline"></p>
                  <div id="hero-text" class="u-mb-md"></div>
                  <div class="c-hero__actions">
                    <a id="hero-btn-primary" href="#ueber-mich" class="c-button c-button--primary"></a>
                    <a id="hero-btn-secondary" href="#kontakt" class="c-button c-button--secondary"></a>
                  </div>
                </div>

                <!-- Profilbild-Kachel -->
                <div class="c-hero__profile">
                  <div class="c-hero__avatar-frame">
                    <img
                      src="assets/portrait.jpg"
                      alt="Marc Schriever"
                      class="c-hero__avatar-img"
                    />
                    <div class="c-hero__avatar-placeholder">
                      <i class="ti ti-user c-hero__avatar-icon" aria-hidden="true"></i>
                      <span class="c-hero__avatar-name">Marc Schriever</span>
                      <span id="hero-photo-label" class="c-hero__avatar-hint"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- STATS SECTION -->
        <section class="o-section o-section--bordered">
          <div class="o-container">
            <div class="o-grid o-grid--4col grid--stats"></div>
          </div>
        </section>

        <!-- ÜBER MICH SECTION -->
        <section id="ueber-mich" class="o-section section--about">
          <div class="o-container">
            <div class="c-section-header">
              <span class="c-section-header__eyebrow section-eyebrow"></span>
              <h2 class="c-section-header__title section-title"></h2>
            </div>
            <div class="o-grid o-grid--2col u-mb-lg">
              <div id="about-text-philosophy" class="c-card reveal"></div>
              <div id="about-text-credo" class="c-card reveal"></div>
            </div>
            <div id="about-fact-rows" class="o-grid o-grid--3col"></div>
          </div>
        </section>

        <!-- EXPERTISE SECTION -->
<section id="expertise" class="o-section section--expertise">
  <div class="o-container">
    <div class="c-section-header">
      <span class="c-section-header__eyebrow section-eyebrow"></span>
      <h2 class="c-section-header__title section-title"></h2>
    </div>
    <div class="o-grid o-grid--2col grid--expertise"></div>
  </div>
</section>

        <!-- FAQ SECTION -->
        <section id="faq" class="o-section section--faq">
          <div class="o-container">
            <div class="c-section-header">
              <span class="c-section-header__eyebrow section-eyebrow"></span>
              <h2 class="c-section-header__title section-title"></h2>
            </div>
            <div class="c-accordion faq-list"></div>
          </div>
        </section>

        <!-- REFERENZEN SECTION -->
        <section id="referenzen" class="o-section section--referenzen">
          <div class="o-container">
            <div class="c-section-header">
              <span class="c-section-header__eyebrow section-eyebrow"></span>
              <h2 class="c-section-header__title section-title"></h2>
            </div>
            <div class="c-reference-strip grid--referenzen"></div>
          </div>
        </section>

        <!-- KONTAKT SECTION -->
        <section id="kontakt" class="o-section o-section--sand section--kontakt">
          <div class="o-container">
            <div class="c-section-header">
              <span class="c-section-header__eyebrow section-eyebrow"></span>
              <h2 class="c-section-header__title kontakt-title"></h2>
              <p class="kontakt-text u-text-muted u-mt-sm"></p>
            </div>
            <div class="c-card reveal" style="max-width: 600px; margin: 0 auto;">
              <form class="c-form" onsubmit="event.preventDefault(); alert('Vielen Dank für Ihre Nachricht!');">
                <div class="c-form__group">
                  <label class="c-form__label form-label--name" for="kontakt-name"></label>
                  <input id="kontakt-name" class="c-form__input form-input--name" type="text" required />
                </div>
                <div class="c-form__group">
                  <label class="c-form__label form-label--email" for="kontakt-email"></label>
                  <input id="kontakt-email" class="c-form__input form-input--email" type="email" required />
                </div>
                <div class="c-form__group">
                  <label class="c-form__label form-label--message" for="kontakt-message"></label>
                  <textarea id="kontakt-message" class="c-form__textarea form-input--message" required></textarea>
                </div>
                <button type="submit" class="c-button c-button--primary c-button--full form-submit"></button>
              </form>
            </div>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="c-footer">
        <div class="o-container c-footer__inner">
          <div class="c-footer__brand">
            <span class="footer-copy"></span> · <span class="footer-location"></span>
          </div>
          <div class="c-footer__links">
            <button type="button" class="c-footer__link footer-link--impressum" onclick="document.getElementById('impressum-modal').classList.add('is-open')"></button>
            <button type="button" class="c-footer__link footer-link--datenschutz" onclick="document.getElementById('datenschutz-modal').classList.add('is-open')"></button>
          </div>
        </div>
      </footer>
    </div>

    <!-- DOKUMENTE MODAL (Supabase Token & Freischaltung) -->
    <div id="dokumente-overlay" class="c-modal dokumente-overlay">
      <div class="c-modal__backdrop"></div>
      <div class="c-modal__window">
        <div class="c-modal__header">
          <h3 class="c-modal__title" id="dokumente-title"></h3>
          <button type="button" id="dokumente-close" class="c-modal__close dokumente-overlay__close" aria-label="Schließen">&times;</button>
        </div>
        <div class="c-modal__body">
          <div id="token-step">
            <p class="u-mb-md" id="dokumente-intro"></p>
            <div class="c-form__group u-mb-md">
              <label for="dokumente-token" class="c-form__label" id="dokumente-token-label"></label>
              <div class="o-flex o-flex--gap-sm">
                <input type="text" id="dokumente-token" class="c-form__input dokumente-overlay__input" />
                <button type="button" id="scan-btn" class="c-button c-button--secondary" title="QR-Code mit Kamera scannen">
                  <i class="ti ti-qrcode" aria-hidden="true"></i> <span id="dokumente-scan-label"></span>
                </button>
              </div>
            </div>
            <div id="dokumente-error" class="dokumente-overlay__error c-form__error u-mb-md"></div>
            <button type="button" id="dokumente-submit" class="c-button c-button--primary c-button--full"></button>
          </div>

          <div id="document-step" style="display: none;">
            <div class="c-form__alert c-form__alert--success u-mb-md" style="display: block;">
              <strong id="dokumente-success-title"></strong><br />
              <span id="dokumente-success-text"></span>
            </div>
            <a id="download-btn" href="#" target="_blank" rel="noopener" class="c-button c-button--primary c-button--full">
              <i class="ti ti-download" aria-hidden="true"></i> <span id="dokumente-download-label"></span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- QR SCANNER MODAL -->
    <div id="scanner-modal" class="c-modal">
      <div class="c-modal__backdrop"></div>
      <div class="c-modal__window" style="max-width: 440px;">
        <div class="c-modal__header">
          <h3 class="c-modal__title" id="scanner-title"></h3>
          <button type="button" id="close-scanner" class="c-modal__close" aria-label="Schließen">&times;</button>
        </div>
        <div class="c-modal__body u-text-center">
          <p class="u-mb-md u-text-muted" style="font-size: 0.85rem;" id="scanner-intro"></p>
          <div id="reader" style="width: 100%; min-height: 250px; background-color: #000; border-radius: var(--radius-sm); overflow: hidden;"></div>
        </div>
      </div>
    </div>

    <!-- IMPRESSUM MODAL -->
    <div id="impressum-modal" class="c-modal">
      <div class="c-modal__backdrop" onclick="document.getElementById('impressum-modal').classList.remove('is-open')"></div>
      <div class="c-modal__window">
        <div class="c-modal__header">
          <h3 class="c-modal__title" id="impressum-title"></h3>
          <button type="button" class="c-modal__close" onclick="document.getElementById('impressum-modal').classList.remove('is-open')">&times;</button>
        </div>
        <div class="c-modal__body">
          <p class="u-bold" id="impressum-name"></p>
          <p id="impressum-role"></p>
          <p id="impressum-location"></p>
          <p class="u-mt-md" id="impressum-email"></p>
        </div>
      </div>
    </div>

    <!-- DATENSCHUTZ MODAL -->
    <div id="datenschutz-modal" class="c-modal">
      <div class="c-modal__backdrop" onclick="document.getElementById('datenschutz-modal').classList.remove('is-open')"></div>
      <div class="c-modal__window">
        <div class="c-modal__header">
          <h3 class="c-modal__title" id="datenschutz-title"></h3>
          <button type="button" class="c-modal__close" onclick="document.getElementById('datenschutz-modal').classList.remove('is-open')">&times;</button>
        </div>
        <div class="c-modal__body" id="datenschutz-body"></div>
      </div>
    </div>

    <!-- SCROLL-STAPLER -->
    <div class="c-scroll-track" aria-hidden="true">
      <svg class="c-scroll-track__vehicle" id="scroll-vehicle" viewBox="0 0 90 40" width="72" height="32">
        <!-- Hubwagen: Deichsel, Rad, durchgehende Gabel -->
        <line x1="8" y1="34" x2="2" y2="16" stroke="var(--color-navy)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="2" cy="16" r="2" fill="var(--color-navy)" />
        <circle cx="8" cy="34" r="4" fill="var(--color-navy)" />
        <rect x="8" y="30.5" width="60" height="3" fill="var(--color-navy)" />
        <circle cx="66" cy="34" r="3" fill="var(--color-navy)" />

        <!-- Fülllevel: Ladung sitzt direkt auf der Gabel, wächst von dort nach oben -->
        <clipPath id="scroll-fill-clip">
          <rect id="scroll-fill-rect" x="12" y="30.5" width="52" height="0" />
        </clipPath>
        <g clip-path="url(#scroll-fill-clip)">
          <rect x="12" y="6" width="52" height="24.5" style="fill: var(--color-primary);" />
          <line x1="12" y1="12" x2="64" y2="12" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.25" />
          <line x1="12" y1="18" x2="64" y2="18" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.25" />
          <line x1="12" y1="24" x2="64" y2="24" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.25" />
          <line x1="24" y1="6" x2="24" y2="30.5" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.2" />
          <line x1="38" y1="6" x2="38" y2="30.5" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.2" />
          <line x1="52" y1="6" x2="52" y2="30.5" stroke="var(--color-navy)" stroke-width="0.6" opacity="0.2" />
        </g>
      </svg>
    </div>

    <!-- HAUPT-SKRIPT (Pfad: js/main.js) -->
<script type="module" src="js/main.js"></script>
  </body>
</html>
