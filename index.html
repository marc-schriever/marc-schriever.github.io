<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Marc Schriever · Logistikexperte</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

  <header class="navbar">
    <div id="app">
      <div class="nav-brand">
        <div class="nav-logo-icon" aria-hidden="true"><i class="ti ti-package"></i></div>
        <div>
          <span class="nav-name"></span>
          <span class="nav-title"></span>
        </div>
      </div>
      <nav aria-label="Hauptnavigation">
        <ul class="nav-links"></ul>
      </nav>
      <button class="nav-hamburger" aria-label="Menü öffnen" aria-expanded="false" aria-controls="nav-overlay">
        <i class="ti ti-menu-2" aria-hidden="true"></i>
      </button>
    <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
      <ul class="nav-overlay__links"></ul>
    </div>
    </div>
  </header>

  <main>

    <section class="section section--hero" id="home" aria-labelledby="hero-title">
      <div class="section__bg section__bg--hero" aria-hidden="true"></div>
      <div id="app" class="grid grid--hero">
        <div class="hero-content">
          <p class="hero-eyebrow"></p>
          <h1 id="hero-title" class="hero-title"></h1>
          <p class="hero-sub"></p>
          <p class="hero-text"></p>
          <div class="hero-btns">
            <a href="#ueber-mich" class="btn btn--primary"></a>
            <a href="#kontakt" class="btn btn--outline"></a>
          </div>
        </div>
        <div class="hero-photo">
          <div class="photo-placeholder">
            <i class="ti ti-user" aria-hidden="true"></i>
            <span class="photo-placeholder__label"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--stats" aria-label="Kennzahlen">
      <div id="app" class="grid grid--stats"></div>
    </section>

    <section class="section section--about" id="ueber-mich" aria-labelledby="about-title">
      <div class="section__bg section__bg--about" aria-hidden="true"></div>
      <div id="app" class="grid grid--about">
        <div class="about-photo">
          <div class="about-img" role="img" aria-label="Modernes Logistiklager"></div>
        </div>
        <div class="about-content">
          <p class="section-eyebrow"></p>
          <h2 id="about-title" class="section-title"></h2>
          <div class="expand-content" id="about-expand" hidden>
            <p></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--expertise" id="expertise" aria-labelledby="expertise-title">
      <div id="app">
        <p class="section-eyebrow section-eyebrow--center"></p>
        <h2 id="expertise-title" class="section-title section-title--center"></h2>
        <div class="grid grid--expertise"></div>
      </div>
    </section>

    <section class="section section--faq" id="faq" aria-labelledby="faq-title">
      <div id="app">
        <p class="section-eyebrow section-eyebrow--center"></p>
        <h2 id="faq-title" class="section-title section-title--center"></h2>
        <div class="faq-list"></div>
      </div>
    </section>

    <section class="section section--referenzen" id="referenzen" aria-labelledby="ref-title">
      <div id="app">
        <p class="section-eyebrow section-eyebrow--center"></p>
        <h2 id="ref-title" class="section-title section-title--center"></h2>
        <div class="grid grid--referenzen"></div>
      </div>
    </section>

  </main>

  <section class="section section--kontakt" id="kontakt">
    <div id="app">
      <p class="section-eyebrow section-eyebrow--center"></p>
      <h2 class="section-title section-title--center kontakt-title"></h2>
      <p class="kontakt-text"></p>
      <form class="kontakt-form" action="https://formspree.io/f/xaewgwgz" method="POST">
        <div class="form-group">
          <label class="form-label--name"></label>
          <input type="text" id="name" name="name" required class="form-input--name">
        </div>
        <div class="form-group">
          <label class="form-label--email"></label>
          <input type="email" id="email" name="email" required class="form-input--email">
        </div>
        <div class="form-group">
          <label class="form-label--message"></label>
          <textarea id="message" name="message" rows="5" required class="form-input--message"></textarea>
        </div>
        <button type="submit" class="btn btn--primary form-submit"></button>
      </form>
    </div>
  </section>

  <footer class="section section--footer">
    <div id="app" class="footer-inner">
      <div class="footer-copy"></div>
      <div class="footer-contact">
        <span><i class="ti ti-map-pin" aria-hidden="true"></i> <span class="footer-location"></span></span>
      </div>
      <div class="footer-legal">
        <a class="footer-link--impressum" href="impressum.html"></a>
        <a class="footer-link--datenschutz" href="datenschutz.html"></a>
      </div>
    </div>
  </footer>

  <script src="content.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
