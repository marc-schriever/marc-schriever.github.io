<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Marc Schriever – Lagerleitung, Logistik und Prozessoptimierung."
    >

    <title>Marc Schriever | Lager & Logistik</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/styles.css?v=navipad1">
</head>

<body class="o-page">

    <a class="c-skip-link" href="#application">
        Zum Hauptinhalt springen
    </a>

    <header class="c-site-header" id="site-header">
        <nav
            class="c-navigation o-container"
            aria-label="Hauptnavigation"
        >
            <a
                class="c-navigation__brand"
                href="#home"
                data-route="home"
            >
                <span class="c-navigation__name">MARC SCHRIEVER</span>
                <span class="c-navigation__title">LAGERLEITER</span>
            </a>

            <div
                class="c-navigation__links"
                id="desktop-navigation"
            ></div>

            <button
                class="c-theme-switcher"
                id="theme-switcher"
                type="button"
                aria-label="Darstellung wechseln"
                aria-pressed="false"
                title="Darstellung wechseln"
            >
                <span
                    class="c-theme-switcher__icon"
                    aria-hidden="true"
                >◐</span>
            </button>
        </nav>

        <div
            class="c-ticker"
            id="site-ticker"
            role="region"
            hidden
        ></div>
    </header>


    <main
        class="c-main o-container"
        id="application"
        tabindex="-1"
    >
        <!-- Die aktuelle Ansicht wird hier durch JavaScript eingesetzt. -->
    </main>


    <footer class="c-site-footer">
        <div class="c-site-footer__content o-container">
            <div>
                <p class="c-site-footer__copy" id="footer-copy"></p>
                <p class="c-site-footer__location" id="footer-location"></p>
            </div>

            <nav
                class="c-site-footer__links"
                aria-label="Rechtliche Informationen"
            >
                <a href="#impressum" data-route="impressum" id="footer-impressum"></a>
                <a href="#datenschutz" data-route="datenschutz" id="footer-datenschutz"></a>
            </nav>
        </div>
    </footer>


    <nav
        class="c-mobile-navigation"
        id="mobile-navigation"
        aria-label="Mobile Navigation"
    >
        <div class="c-mobile-navigation__items"></div>
    </nav>


    <script
        src="./vendor/html5-qrcode.min.js"
        defer
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"
        defer
    ></script>
    <script
        type="module"
        src="./js/app.js?v=theme2"
        ></script>

</body>
</html>
